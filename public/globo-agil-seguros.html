<style>
/* Layout: globo em tela cheia; legenda e controle discretos no canto inferior esquerdo */
:root {
  --navy-deep: #00112B;
  --navy: #003580;      /* azul Ágil (botão Entrar) */
  --blue: #2A6BB5;
  --line: #6FA8E8;
  --ice: #C8E0F5;
  --paper: #F0F7FF;
  --font-ui: "Plus Jakarta Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--navy-deep);
  color: var(--paper);
  font-family: var(--font-ui);
  overflow: hidden;
}
.stage { position: fixed; inset: 0; }
#globo { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
#globo:active { cursor: grabbing; }
.legenda {
  position: fixed;
  left: 0; bottom: 0;
  padding-left: max(24px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 10px;
  pointer-events: none;
}
.topo {
  position: fixed; top: 0; left: 0; right: 0;
  padding-top: calc(24px + env(safe-area-inset-top, 0px));
  padding-left: max(24px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  pointer-events: none;
}
.marca { font-weight: 700; font-size: 1.5rem; letter-spacing: .01em; }
.marca svg { display: block; height: 50px; width: auto; max-width: 60vw; color: var(--paper); filter: drop-shadow(0 2px 12px rgba(0,17,43,.45)); }
.sub { font-size: .8rem; color: var(--ice); opacity: .8; letter-spacing: .06em; text-transform: uppercase; }
.sub b { font-variant-numeric: tabular-nums; color: var(--paper); font-weight: 600; }
.acoes { display: flex; gap: 8px; flex-wrap: wrap; pointer-events: auto; }
button {
  font: 600 .8rem var(--font-ui);
  color: var(--paper);
  background: color-mix(in srgb, var(--navy) 55%, transparent);
  border: 1px solid color-mix(in srgb, var(--line) 45%, transparent);
  border-radius: 999px;
  padding: 8px 14px;
  cursor: pointer;
  backdrop-filter: blur(6px);
}
button:hover { background: color-mix(in srgb, var(--blue) 60%, transparent); }
button:focus-visible { outline: 2px solid var(--ice); outline-offset: 2px; }
.dica { font-size: .75rem; color: var(--ice); opacity: .6; }
@media (max-width: 480px) { .marca { font-size: 1.2rem; } .marca svg { height: 36px; } }
</style>

    body.addColorStop(0, `rgba(42,107,181,${.55 * appear})`); body.addColorStop(.7, `rgba(0,53,128,${.55 * appear})`); body.addColorStop(1, `rgba(0,30,80,${.75 * appear})`);
    ctx.fillStyle = body; ctx.beginPath(); ctx.arc(cx, cy, R, 0, 6.283); ctx.fill();
    ctx.strokeStyle = `rgba(${C.ice},${.35 * appear})`; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, 6.283); ctx.stroke();

    // grade de pontos da esfera
    ctx.fillStyle = `rgb(${C.line})`;
    for (let i = 0; i < gridV.length; i += 3) {
      const p = proj(gridV, i); const f = facing(p[2]);
      if (f <= 0) continue;
      const a = .5 * f * appear; if (a < .01) continue;
      ctx.globalAlpha = a; const r = .9 + p[3] / F * .5;
      ctx.fillRect(p[0] - r / 2, p[1] - r / 2, r, r);
    }
    ctx.globalAlpha = 1;

    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    // estados + contorno
    const bp = reduce ? 1 : ease(win(t, .3, 3.0));
    if (bp > 0) {
      ctx.strokeStyle = `rgb(${C.line})`;
      for (const b of borders) strokePoly(b, bp, .30 * bp, 1);
      ctx.strokeStyle = `rgb(${C.ice})`;
      for (const o of outline) { strokePoly(o, bp, .10 * bp, 6); strokePoly(o, bp, .85 * bp, 1.5); }
    }

    // posições dos nós
    const NP = new Float32Array(N * 4);
    for (let i = 0; i < N; i++) { const p = proj(nodeV, i * 3); NP.set(p, i * 4); }

    // malha (plexo)
    const mp = reduce ? 1 : win(t, 2.6, 6.2);
    if (mp > 0) {
      ctx.strokeStyle = `rgb(${C.line})`; ctx.lineWidth = .9;
      DATA.edges.forEach(([a, b], k) => {
        const loc = Math.min(1, Math.max(0, (mp * 1.3 - edgeD[k]) / .3)); if (loc <= 0) return;
        const za = NP[a*4+2], zb = NP[b*4+2]; const f = Math.min(facing(za), facing(zb)); if (f <= 0) return;
        const ax = NP[a*4], ay = NP[a*4+1]; let bx = NP[b*4], by = NP[b*4+1];
        if (loc < 1) { const e = ease(loc); bx = ax + (bx - ax) * e; by = ay + (by - ay) * e; }
        ctx.globalAlpha = loc * f * (.30 + .12 * Math.sin(t * .9 + a));
        ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
      });
      ctx.globalAlpha = 1;
    }

    // arcos entre capitais
    ctx.globalCompositeOperation = 'lighter';
    for (const arc of arcs) {
      const p = reduce ? 1 : ease(win(t, arc.start, arc.start + 1.1)); if (p <= 0) continue;
      const last = Math.max(1, Math.floor(SEG * p));
      ctx.beginPath(); let vis = 1;
      for (let s = 0; s <= last; s++) {
        const q = proj(arc.pts, s * 3); vis = Math.min(vis, facing(q[2]));
        s ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]);
      }
      if (vis <= 0) continue;
      ctx.strokeStyle = `rgba(${C.ice},${.07 * vis})`; ctx.lineWidth = 3.5; ctx.stroke();
      ctx.strokeStyle = `rgba(${C.ice},${.42 * vis})`; ctx.lineWidth = 1; ctx.stroke();
      if (p < 1) {
        const q = proj(arc.pts, last * 3); ctx.drawImage(glowWhite, q[0] - 9, q[1] - 9, 18, 18);
      } else {
        for (const off of [0, .5]) {
          const u = ((t - arc.start - 1.1) * arc.sp + arc.ph + off) % 1;
          const fi = u * SEG, i0 = Math.floor(fi), fr = fi - i0;
          const q0 = proj(arc.pts, i0 * 3), x0 = q0[0], y0 = q0[1];
          const q1 = proj(arc.pts, Math.min(SEG, i0 + 1) * 3);
          const x = x0 + (q1[0] - x0) * fr, y = y0 + (q1[1] - y0) * fr;
          const a = Math.sin(Math.PI * u) * vis; const sz = 14;
          ctx.globalAlpha = a; ctx.drawImage(glowWhite, x - sz / 2, y - sz / 2, sz, sz);
        }
        ctx.globalAlpha = 1;
      }
    }

    // nós
    for (let i = 0; i < N; i++) {
      const cap = DATA.kind[i] === 1;
      const ap = reduce ? 0 : (cap ? 4.2 + dist[i] * 1.8 : 1.8 + dist[i] * 3.0);
      const a = reduce ? 1 : ease(win(t, ap, ap + .7)); if (a <= 0) continue;
      const x = NP[i*4], y = NP[i*4+1], f = facing(NP[i*4+2]); if (f <= 0) continue;
      const s = Math.min(1.6, Math.sqrt(NP[i*4+3] / (F / 2.2)) * .8);   // escala de profundidade relativa
      if (cap) {
        const big = i === DATA.hub ? 1.4 : 1;
        const rt = ((t - ap) / 2.8 + phase[i] / 6.283) % 1;
        ctx.strokeStyle = `rgba(${C.ice},${a * f * (1 - rt) * .6})`; ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.arc(x, y, (4 + rt * 18) * s * big, 0, 6.283); ctx.stroke();
        const g = 20 * s * big; ctx.globalAlpha = a * f; ctx.drawImage(glowLine, x - g / 2, y - g / 2, g, g);
        const c = 7 * s * big; ctx.drawImage(glowWhite, x - c / 2, y - c / 2, c, c);
        ctx.fillStyle = `rgb(${C.white})`; ctx.beginPath(); ctx.arc(x, y, 1.9 * s * big, 0, 6.283); ctx.fill();
      } else {
        const tw = .6 + .4 * Math.sin(t * 2 + phase[i]);
        const g = 9 * s; ctx.globalAlpha = a * f * tw; ctx.drawImage(glowIce, x - g / 2, y - g / 2, g, g);
      }
      ctx.globalAlpha = 1;
    }
    ctx.globalCompositeOperation = 'source-over';

    // vinheta
    const v = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .4, W / 2, H / 2, Math.hypot(W, H) * .62);
    v.addColorStop(0, 'rgba(0,10,30,0)'); v.addColorStop(1, 'rgba(0,10,30,.55)');
    ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
